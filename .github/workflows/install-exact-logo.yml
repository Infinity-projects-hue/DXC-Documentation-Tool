name: Install exact DXC logo

on:
  pull_request:

permissions:
  contents: write

jobs:
  install-logo:
    if: github.head_ref == 'add-exact-dxc-logo'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Retrieve and verify exact PNG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          import hashlib
          import json
          import re

          expected = "02e27e9703e2eb53b976b466222f9595452aa41ba99c547bb12a2246bbff7c31"
          headers = {"User-Agent": "Mozilla/5.0 DXC-Documentation-Tool"}
          candidates = [
              "https://amcham.no/wp-content/uploads/2026/01/DXC-Full-Color_2026.png",
              "https://amcham.no/wp-content/uploads/2026/01/DXC-Full-Color.png",
              "https://amcham.no/wp-content/uploads/2026/01/DXC-Full-Color_2026-1.png",
              "https://amcham.no/wp-content/uploads/2026/01/DXC-Full-Color-1.png",
          ]

          api_urls = [
              "https://amcham.no/wp-json/wp/v2/media?slug=dxc-full-color_2026",
              "https://amcham.no/wp-json/wp/v2/media?search=" + quote("DXC-Full-Color") + "&per_page=100",
          ]

          for api_url in api_urls:
              try:
                  request = Request(api_url, headers=headers)
                  data = json.loads(urlopen(request, timeout=30).read().decode("utf-8"))
                  for item in data if isinstance(data, list) else []:
                      source = item.get("source_url")
                      if isinstance(source, str):
                          candidates.append(source)
              except Exception as error:
                  print(f"Media API lookup failed for {api_url}: {error}")

          try:
              page = urlopen(
                  Request(
                      "https://amcham.no/members/dxc-technology/dxc-full-color_2026/",
                      headers=headers,
                  ),
                  timeout=30,
              ).read().decode("utf-8", errors="ignore")
              candidates.extend(
                  re.findall(r'https://amcham\.no/wp-content/uploads/[^"\'<> ]+\.png', page)
              )
          except Exception as error:
              print(f"Attachment page lookup failed: {error}")

          seen = set()
          for url in candidates:
              if url in seen:
                  continue
              seen.add(url)
              try:
                  print(f"Checking {url}")
                  data = urlopen(Request(url, headers=headers), timeout=45).read()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest == expected:
                      destination = Path("public/DXC-Full-Color.png")
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(data)
                      print(f"Exact PNG verified and written: {destination}")
                      break
              except Exception as error:
                  print(f"Download failed for {url}: {error}")
          else:
              raise SystemExit("Could not locate the exact checksum-matching DXC PNG.")
          PY

      - name: Commit exact logo to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/DXC-Full-Color.png
          git commit -m "Add exact DXC full-color PNG logo"
          git push origin HEAD:main
