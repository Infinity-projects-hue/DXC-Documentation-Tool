name: Fix Gemini structured output

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gemini-request:
    if: github.head_ref == 'fix-gemini-structured-output'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply model-specific Gemini configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/analyze/route.ts')
          text = path.read_text()

          old = '''        generationConfig: {
          temperature: 0.1,
          maxOutputTokens: 2200,
          responseFormat: {
            text: {
              mimeType: "application/json",
              schema: responseSchema,
            },
          },
        },
'''

          new = '''        generationConfig: model.startsWith("gemini-3")
          ? {
              maxOutputTokens: 2200,
              responseFormat: {
                text: {
                  mimeType: "application/json",
                  schema: responseSchema,
                },
              },
            }
          : {
              maxOutputTokens: 2200,
              responseMimeType: "application/json",
              responseJsonSchema: responseSchema,
            },
'''

          if old not in text:
              raise SystemExit('Expected Gemini generationConfig block was not found.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/analyze/route.ts
          git commit -m "Fix Gemini structured output compatibility"
          git push origin HEAD:main
